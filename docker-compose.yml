# docker-compose.yml
services:
  backend:
    build: .
    container_name: makerhub-backend
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./assets/default-images:/docker-entrypoint-init.d/images
      - ./app:/app/app  # 开发环境热重载
      - ./logs:/app/logs  # 日志持久化
    depends_on:
      mysql: # <-- 修改：依赖于 mysql
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - makerhub-network

  # --- Mongo 服务被移除 ---

  # +++ 新增 MySQL 服务 +++
  mysql:
    image: mysql:8.0
    container_name: makerhub-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql # 数据持久化
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro # 初始化脚本
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost", "-u", "${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - makerhub-network

  minio:
    image: minio/minio
    container_name: makerhub-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_BROWSER_REDIRECT_URL: https://frp-dog.com:57286  #minio:9001的反向代理域名，用于网页前端访问的
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped
    command: server /data --console-address ":9001" --address ":9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./data/minio:/data
    networks:
      - makerhub-network

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./docker/minio/init.sh:/usr/bin/init.sh
      - ./assets/default-images:/docker-entrypoint-init.d/images
      - /etc/localtime:/etc/localtime:ro
    entrypoint: ["/bin/sh", "/usr/bin/init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    networks:
      - makerhub-network
    restart: on-failure

  admin-frontend:
    build: ./admin-frontend
    container_name: makerhub-admin
    user: "root"
    ports:
      - "3001:3000"
    volumes:
      - ./admin-frontend:/app
      - /app/node_modules
    command: sh -c "chown -R root:root /app && npm start"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - makerhub-network

networks:
  makerhub-network:
    driver: bridge