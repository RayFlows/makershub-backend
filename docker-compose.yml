# docker-compose.yml 
services:
  backend:
    build: .
    container_name: makershub-backend
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./assets/default-images:/docker-entrypoint-init.d/images
      - ./app:/app/app
      - ./logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks:
      - makershub-network

  mysql:
    image: mysql:8.0
    container_name: makershub-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost", "-u", "${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - makershub-network

  minio:
    image: minio/minio
    container_name: makershub-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_SERVER_URL: ${MINIO_PUBLIC_URL}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL}
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped
    command: server /data --console-address ":9001" --address ":9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./data/minio:/data
    networks:
      - makershub-network

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./docker/minio/init.sh:/usr/bin/init.sh
      - ./assets/default-images:/docker-entrypoint-init.d/images
      - /etc/localtime:/etc/localtime:ro
    entrypoint: ["/bin/sh", "/usr/bin/init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_AVATAR_BUCKET: ${MINIO_AVATAR_BUCKET}
      MINIO_POSTER_BUCKET: ${MINIO_POSTER_BUCKET}
      MINIO_PUBLIC_BUCKET: ${MINIO_PUBLIC_BUCKET}
    networks:
      - makershub-network
    restart: on-failure

  admin-frontend:
    build: ./admin-frontend
    container_name: makershub-admin
    user: "root"
    ports:
      - "3001:3000"
    volumes:
      - ./admin-frontend:/app
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL}
      - WDS_SOCKET_PORT=0
    command: sh -c "chown -R root:root /app && npm start"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - makershub-network

networks:
  makershub-network:
    driver: bridge